# Substitui o default.conf do nginx:alpine. Site 100% estático: o que importa
# para o pico de acesso é não reenviar byte que o browser já tem.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;
    # vídeo, webp, png e o APK já vêm comprimidos: gzip só gastaria CPU.

    # assets do Vite têm hash no nome; se o conteúdo muda, o nome muda.
    # sem `expires`: ele emite um Cache-Control proprio e o response sairia com dois.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /media/  { add_header Cache-Control "public, max-age=2592000"; }

    # o APK saiu daqui para o release do GitHub (65 GB de egress que a VPS nao
    # precisa pagar). O redirect mantem link antigo e QR code ja impresso vivos.
    location = /sabiaa.apk {
        return 302 https://github.com/Gabriel-Richard-dev/sabiaa/releases/latest/download/sabiaa.apk;
    }

    # o HTML é o único arquivo sem hash: precisa revalidar para a versão nova aparecer.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /demo/index.html { add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ /index.html; }
}
